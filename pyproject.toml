[project]
name = "pi-panel-immich"
version = "0.4.0"
description = "pi-panel app: an Immich photo frame, Ken Burns slideshow with portrait grouping"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.5",
    "requests>=2.31",
    "pillow>=10.0",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.28.0",
    "pi-panel-varlink",
]

[project.scripts]
pi-panel-immich = "pi_panel_immich.cli:main"

# Installed by pi-panel-pkg into /opt/pi-panel/pi-panel-apps/immich, next to
# pi-panel-core, so this relative path works there and in development.
[tool.uv.sources]
pi-panel-varlink = { path = "../../pi-panel-core/pi-panel-core-ctl/packages/pi-panel-varlink" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0",      # only for --convert-yaml's test
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_immich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
