[package]
name = "immich"
kind = "app"
version = "0.4.1"
description = "Immich photo frame: Ken Burns slideshow with portrait grouping"

[run]
# The venv's console script: everything it needs is in .venv, built at install.
exec = ".venv/bin/pi-panel-immich --config ${config_dir}/config.toml"
# Sets the Wayland app_id (SDL 2.26+ reads SDL_APP_ID; the older
# SDL_VIDEO_WAYLAND_* names are ignored).
env = { SDL_APP_ID = "immich" }

[build]
# Everything into the package's own .venv at install time, precompiled: the
# Pi boots from slow storage, and an image's /opt is read-only afterwards
# (nothing may live in ~/.cache/uv).
command = "uv sync --frozen --no-dev --compile-bytecode"

[config]
templates = ["config.toml.example"]
# Run by `pi-panel-ctl config check` (and before `config import`): no pygame, no display.
check = ".venv/bin/pi-panel-immich --check-config ${config_dir}/config.toml"

[system]
# SDL comes with pygame and pysdl2-dll, but it dlopens these from the system.
# On a Lite image they arrive only by accident, through the compositor's
# -dev build packages. See PACKAGES.md.
packages = [
    "libegl1",
    "libgl1",
    "libwayland-egl1",
    "libwayland-cursor0",
]

[app]
varlink = true
